<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayward Palms Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table app — catalog rail | live plan sheet | inspector rail; stacks under 900px */
:root {
  --bg: #e9ece8; --panel: #f8f9f7; --ink: #1d2320; --muted: #5d6862; --rule: #d3d9d4;
  --accent: #2c6a50; --accent-ink: #ffffff; --accent-soft: #dbe9e1; --sel: #c9661f; --danger: #b23a2a;
  --sheet: #fdfdfb; --floor: #f6f5f0; --paper: #ffffff; --wall: #262b28;
  --line-strong: #4b524e; --line: #8a918c; --line-soft: #a9afab; --fixture: #a9afaa;
  --grid: rgba(44,106,80,.10); --room: #6b7670;
  --sage-f: #d6e7dc; --sage-s: #2f6b51; --sand-f: #efe3cc; --sand-s: #8a6427;
  --clay-f: #f1d8cd; --clay-s: #a24a2e; --slate-f: #d8e0ea; --slate-s: #3a5674;
  --plum-f: #e7dbe8; --plum-s: #6d3f72;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --panel: #181e1b; --ink: #e2e8e4; --muted: #98a49d; --rule: #2b3430;
  --accent: #74c49c; --accent-ink: #0f1a14; --accent-soft: #20352b; --sel: #f0a35a; --danger: #ef8070;
  --sheet: #151a18; --floor: #1f2623; --paper: #2a322e; --wall: #dfe5e1;
  --line-strong: #b9c1bc; --line: #858f89; --line-soft: #5f6964; --fixture: #6c7771;
  --grid: rgba(116,196,156,.12); --room: #9aa6a0;
  --sage-f: #24392e; --sage-s: #86cfa8; --sand-f: #3a3122; --sand-s: #e0b86e;
  --clay-f: #3d2620; --clay-s: #ee9a7a; --slate-f: #222e3b; --slate-s: #93b4d8;
  --plum-f: #352638; --plum-s: #d3a2d8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111513; --panel: #181e1b; --ink: #e2e8e4; --muted: #98a49d; --rule: #2b3430;
  --accent: #74c49c; --accent-ink: #0f1a14; --accent-soft: #20352b; --sel: #f0a35a; --danger: #ef8070;
  --sheet: #151a18; --floor: #1f2623; --paper: #2a322e; --wall: #dfe5e1;
  --line-strong: #b9c1bc; --line: #858f89; --line-soft: #5f6964; --fixture: #6c7771;
  --grid: rgba(116,196,156,.12); --room: #9aa6a0;
  --sage-f: #24392e; --sage-s: #86cfa8; --sand-f: #3a3122; --sand-s: #e0b86e;
  --clay-f: #3d2620; --clay-s: #ee9a7a; --slate-f: #222e3b; --slate-s: #93b4d8;
  --plum-f: #352638; --plum-s: #d3a2d8; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, .cat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 236px minmax(0,1fr) 272px; grid-template-rows: auto minmax(0,1fr);
  grid-template-areas: "top top top" "cat stage insp"; }
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; background: var(--panel);
  border-bottom: 1px solid var(--rule); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.brand p span { font-family: var(--font-mono); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: var(--r); padding: 6px 10px; cursor: pointer; font-size: 13px; line-height: 1.2; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger-fill { background: var(--danger); border-color: var(--danger); color: var(--panel); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 8px; border-radius: var(--r); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); margin: 0; }
.sep { width: 1px; height: 22px; background: var(--rule); }
.reset-wrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 260px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 10px; }
.pop p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.pop .row { display: flex; flex-direction: column; gap: 6px; }

.rail { background: var(--panel); overflow-y: auto; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
.cat { grid-area: cat; border-right: 1px solid var(--rule); padding-left: max(14px, env(safe-area-inset-left, 0px)); }
.insp { grid-area: insp; border-left: 1px solid var(--rule); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.rail h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.group { display: flex; flex-direction: column; gap: 6px; }
.cat-list { display: grid; grid-template-columns: 1fr; gap: 2px; }
.cat-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: var(--r); padding: 6px 8px; cursor: pointer; }
.cat-btn:hover { background: var(--accent-soft); }
.cat-btn .dim { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.cat-btn .plus { color: var(--accent); font-weight: 700; margin-right: 2px; }
.custom { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.custom input[type=text] { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.inp { width: 100%; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r); padding: 6px 8px; }
.inp.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.unit { position: relative; }
.unit span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; font-family: var(--font-mono); }
.unit .inp { padding-right: 22px; }

.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; background: var(--sheet); overflow: hidden; }
#stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#stage.panning { cursor: grabbing; }
.item { cursor: move; }
.item .b { fill: var(--f); stroke: var(--s); stroke-width: .55; }
.item .d { fill: none; stroke: var(--s); stroke-width: .35; }
.item .k { fill: var(--s); stroke: none; }
.item .p { fill: var(--paper); stroke: var(--s); stroke-width: .35; }
.item.rug .b { fill-opacity: .55; stroke-dasharray: 2 1.2; }
.item.selected .b { stroke: var(--sel); stroke-width: .8; }
.flabel { font-family: var(--font-ui); fill: var(--ink); text-anchor: middle; pointer-events: none; font-weight: 600; paint-order: stroke; stroke: var(--f); stroke-width: .6; stroke-linejoin: round; }
.flabel tspan.dm { font-family: var(--font-mono); font-weight: 400; fill: var(--muted); }
.room-name { font-family: var(--font-ui); font-weight: 600; letter-spacing: .08em; fill: var(--room); text-anchor: middle; pointer-events: none; text-transform: uppercase; }
.room-sf { font-family: var(--font-mono); fill: var(--room); text-anchor: middle; pointer-events: none; opacity: .85; }
.hdl { fill: var(--paper); stroke: var(--sel); }
.hdl-rot { fill: var(--sel); stroke: var(--paper); cursor: grab; }
.sel-box { fill: none; stroke: var(--sel); stroke-dasharray: 3 2; pointer-events: none; }
.sel-stem { stroke: var(--sel); pointer-events: none; }

.hud { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 4px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px 6px; pointer-events: none; }
.scalebar { display: flex; height: 7px; border: 1px solid var(--ink); }
.scalebar i { display: block; height: 100%; }
.scalebar i:nth-child(odd) { background: var(--ink); }
.scale-lbls { position: relative; height: 13px; font-family: var(--font-mono); font-size: 11px; color: var(--ink); }
.scale-lbls b { position: absolute; top: 0; font-weight: 400; transform: translateX(-50%); white-space: nowrap; }
.scale-note { font-size: 11px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; gap: 4px; }
.zoom .btn { background: var(--panel); min-width: 34px; justify-content: center; }
.readout { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 3px 7px; border-radius: 5px; pointer-events: none; }

.empty { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; }
.list { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.list button { width: 100%; display: flex; justify-content: space-between; gap: 8px; border: 0; background: transparent; padding: 5px 6px; border-radius: 5px; cursor: pointer; text-align: left; }
.list button:hover { background: var(--accent-soft); }
.list .dim { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.swatches { display: flex; gap: 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--s); background: var(--f); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--sel); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.keys { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0; padding: 0; list-style: none; }
.keys kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--sheet); color: var(--ink); }
.sample-note { font-size: 12px; color: var(--muted); background: var(--accent-soft); border-radius: var(--r); padding: 8px 10px; line-height: 1.45; margin: 0; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0,1fr); grid-template-rows: auto 64vh auto auto; grid-template-areas: "top" "stage" "insp" "cat"; }
  .rail { overflow: visible; border: 0; border-top: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cat-list { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .pop { right: auto; left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .cat-btn { transition: background-color .12s, border-color .12s; } }
</style>

<body>


<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Wayward Palms · Furniture Planner</h1>
      <p>Main level, stud to stud (Final plan) · drawn at <span>1/8″ = 1′-0″</span> · walls and doors locked</p>
    </div>
    <div class="tools">
      <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <span class="sep" aria-hidden="true"></span>
      <label class="toggle"><input type="checkbox" id="tg-grid" checked> 1 ft grid</label>
      <label class="toggle"><input type="checkbox" id="tg-rooms" checked> Room names</label>
      <label class="toggle"><input type="checkbox" id="tg-labels" checked> Furniture labels</label>
      <label class="toggle"><input type="checkbox" id="tg-snap" checked> Snap</label>
      <span class="sep" aria-hidden="true"></span>
      <div class="reset-wrap">
        <button class="btn danger" id="reset-btn" aria-expanded="false" aria-controls="reset-pop">Reset layout</button>
        <div class="pop" id="reset-pop" hidden>
          <p>Choose how to reset. You can undo either one.</p>
          <div class="row">
            <button class="btn primary" id="reset-sample">Restore starting layout</button>
            <button class="btn danger-fill" id="reset-clear">Remove all furniture</button>
            <button class="btn" id="reset-cancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <aside class="rail cat" aria-label="Furniture catalog">
    <div class="group">
      <h2>Add furniture</h2>
      <p class="empty" style="font-size:12px">Click an item to drop it in the middle of the view. Sizes are typical; adjust after placing.</p>
    </div>
    <div id="catalog" class="group" style="gap:14px"></div>
    <div class="group">
      <h2>Custom piece</h2>
      <form class="custom" id="custom-form">
        <input class="inp" type="text" id="c-name" placeholder="Name, e.g. Hall tree" maxlength="40">
        <div class="field"><label for="c-w">Width (in)</label><input class="inp num" type="number" id="c-w" min="3" max="480" value="36"></div>
        <div class="field"><label for="c-d">Depth (in)</label><input class="inp num" type="number" id="c-d" min="3" max="480" value="18"></div>
        <button class="btn primary" type="submit" style="grid-column:1/-1;justify-content:center">Add custom piece</button>
      </form>
    </div>
  </aside>

  <main class="stage" id="stage-wrap">

function shapeSVG(it) {
  const W = it.w * PT, D = it.d * PT, x0 = -W / 2, y0 = -D / 2, m = Math.min(W, D);
  const R = (x, y, w, h, c = 'd', rx = 0) => `<rect class="${c}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${Math.max(0, w).toFixed(2)}" height="${Math.max(0, h).toFixed(2)}" rx="${rx}"/>`;
  const L = (a, b, c, d) => `<line class="d" x1="${a.toFixed(2)}" y1="${b.toFixed(2)}" x2="${c.toFixed(2)}" y2="${d.toFixed(2)}"/>`;

      const n = W > 45 ? 2 : 1, pad = W * .06, ph = Math.min(D * .12, 9), gap = W * .04;

      s = body + R(x0, y0, W, Math.min(D * .05, 2.5), 'k');
      for (let i = 0; i < n; i++) s += R(x0 + pad + i * (pw + gap), y0 + D * .08, pw, ph, 'p', 1.2);

    case 'sofa': case 'chair': {
      const back = D * (it.shape === 'sofa' ? .24 : .22), arm = W < 20 ? 0 : Math.min(W * .13, 4.5);
      s = body + R(x0, y0, W, back, 'd', .8);

      const seats = it.shape === 'sofa' ? (W > 70 ? 3 : 2) : 1, sw = (W - 2 * arm) / seats;
      for (let i = 1; i < seats; i++) s += L(x0 + arm + i * sw, y0 + back, x0 + arm + i * sw, -y0);
      break; }

      s = `<ellipse class="b" cx="0" cy="0" rx="${(W / 2).toFixed(2)}" ry="${(D / 2).toFixed(2)}"/>`;

      const n = Math.max(1, Math.round(W / 16)); for (let i = 1; i < n; i++) s += L(x0 + i * W / n, y0, x0 + i * W / n, -y0);

function setView(user = true) {
  if (user) userView = true;
  vp.setAttribute('transform', `translate(${view.tx.toFixed(2)} ${view.ty.toFixed(2)}) scale(${view.s.toFixed(5)})`);
  renderSelection();
  renderScale();
}
function render() {
  const order = [...items].sort((a, b) => (b.shape === 'rug') - (a.shape === 'rug'));
  $('furniture').innerHTML = order.map(it =>
    `<g class="item ${it.shape === 'rug' ? 'rug' : ''} ${it.id === selId ? 'selected' : ''}" data-id="${it.id}" style="--f:var(--${it.color}-f);--s:var(--${it.color}-s)" transform="translate(${wx(it.x).toFixed(2)} ${wy(it.y).toFixed(2)}) rotate(${it.rot})">${shapeSVG(it)}</g>`).join('');
  $('labels').innerHTML = !prefs.labels ? '' : order.map(it => {
    const W = it.w * PT, D = it.d * PT, a = it.rot * Math.PI / 180;
    const bw = Math.abs(W * Math.cos(a)) + Math.abs(D * Math.sin(a)), bh = Math.abs(W * Math.sin(a)) + Math.abs(D * Math.cos(a));
    const name = it.name || 'Item';
    let fs = Math.min(4.2, (bw * .9) / (name.length * .58), bh * .32);
    fs = Math.max(fs, 1.6);
    const dims = `${fmt(it.w)} × ${fmt(it.d)}`;
    const ds = Math.min(fs * .8, (bw * .9) / (dims.length * .62));
    const showDims = ds >= 1.7 && bh > fs * 2.6;
    const cx = wx(it.x), cy = wy(it.y) + (it.shape === 'rug' ? bh / 2 - (showDims ? fs * 2.4 : fs * 1.2) : 0);
    return `<text class="flabel" style="--f:var(--${it.color}-f)" x="${cx.toFixed(2)}" y="${(cy + (showDims ? -ds * .25 : fs * .35)).toFixed(2)}" font-size="${fs.toFixed(2)}">${esc(name)}${showDims ? `<tspan class="dm" x="${cx.toFixed(2)}" dy="${(ds * 1.25).toFixed(2)}" font-size="${ds.toFixed(2)}">${dims}</tspan>` : ''}</text>`;
  }).join('');
  renderSelection();
  $('undo').disabled = !hist.length; $('redo').disabled = !fut.length;
}
function renderRooms() {
  $('rooms').innerHTML = !prefs.rooms ? '' : ROOMS.map(([n, name, sf, x, y]) => {
    const small = !sf || sf < 40, fs = small ? (sf && sf < 12 ? 1.8 : 2.6) : 4.4;
    const label = `<text class="room-name" x="${x}" y="${y}" font-size="${fs}">${esc(name)}</text>`;
    const area = sf ? `<text class="room-sf" x="${x}" y="${(y + fs * 1.2).toFixed(2)}" font-size="${(fs * .8).toFixed(2)}">${n === 12 || n === 19 || n === 21 ? '~' : ''}${sf} SF</text>` : '';
    return label + area;
  }).join('');
}
function renderSelection() {
  const g = $('selection'), it = sel();
  if (!it) { g.innerHTML = ''; return; }
  const W = it.w * PT, D = it.d * PT, hs = 9 / view.s, sw = 1.2 / view.s, stem = 26 / view.s;
  const pad = 1.5 / view.s;
  const hx = [-1, 0, 1], hy = [-1, 0, 1];
  let h = `<rect class="sel-box" x="${-W / 2 - pad}" y="${-D / 2 - pad}" width="${W + 2 * pad}" height="${D + 2 * pad}" stroke-width="${sw}" stroke-dasharray="${4 / view.s} ${3 / view.s}"/>`;
  h += `<line class="sel-stem" x1="0" y1="${-D / 2 - pad}" x2="0" y2="${-D / 2 - stem}" stroke-width="${sw}"/>`;
  for (const sx of hx) for (const sy of hy) {
    if (!sx && !sy) continue;
    const cur = (sx && sy) ? ((sx * sy > 0) ? 'nwse' : 'nesw') : (sx ? 'ew' : 'ns');
    h += `<rect class="hdl" data-handle="${sx},${sy}" x="${sx * (W / 2 + pad) - hs / 2}" y="${sy * (D / 2 + pad) - hs / 2}" width="${hs}" height="${hs}" stroke-width="${sw}" style="cursor:${rotCursor(cur, it.rot)}-resize"/>`;
  }
  h += `<circle class="hdl-rot" data-handle="rot" cx="0" cy="${-D / 2 - stem}" r="${6 / view.s}" stroke-width="${sw}"/>`;
  g.setAttribute('transform', `translate(${wx(it.x)} ${wy(it.y)}) rotate(${it.rot})`);
  g.innerHTML = h;
}
function rotCursor(c, rot) {
  const seq = ['ns', 'nesw', 'ew', 'nwse'];
  return seq[(seq.indexOf(c) + Math.round(norm(rot) / 45)) % 4];
}
function renderScale() {
  const pxPerFt = PT * view.s;
  const nice = [1, 2, 4, 5, 10, 20, 25, 50];
  let L = nice.find(n => n * pxPerFt >= 110) || 50;
  const segs = L <= 2 ? L * 2 : (L === 25 ? 5 : 4);
  const total = L * pxPerFt;
  $('scalebar').style.width = total + 'px';
  $('scalebar').innerHTML = Array.from({ length: segs }, () => `<i style="width:${total / segs}px"></i>`).join('');
  $('scalelbls').style.width = total + 'px';
  $('scalelbls').innerHTML = `<b style="left:0">0</b><b style="left:50%">${fmtIn(L * 6)}</b><b style="left:100%">${L} ft</b>`;
  $('scalenote').textContent = `1 ft = ${pxPerFt.toFixed(1)} px on screen`;
}

// ---- Inspector ----
function renderInspector() {
  const el = $('insp'), it = sel();
  if (!it) {
    const n = items.length;
    el.innerHTML = `
      <div class="group"><h2>Layout</h2>
        <p class="empty">${n ? `${n} piece${n === 1 ? '' : 's'} placed. Select one on the plan or below to edit it.` : 'No furniture yet. Add pieces from the catalog.'}</p>
      </div>
      ${n ? `<ul class="list">${[...items].sort((a, b) => a.name.localeCompare(b.name)).map(i => `<li><button data-pick="${i.id}"><span>${esc(i.name)}</span><span class="dim">${fmt(i.w)} × ${fmt(i.d)}</span></button></li>`).join('')}</ul>` : ''}
      <div class="group"><h2>Controls</h2>
        <ul class="keys">
          <li>Drag a piece to move it. Drag empty floor to pan.</li>
          <li>Square handles resize; the round handle rotates (15° steps while snapping).</li>
          <li>Scroll or pinch to zoom.</li>
          <li><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> nudge 1″, with <kbd>Shift</kbd> 1 ft</li>
          <li><kbd>R</kbd> rotate 90° · <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate · <kbd>Del</kbd> remove</li>
          <li>Hold <kbd>Alt</kbd> while dragging to skip snapping.</li>
        </ul>
      </div>
      <p class="sample-note">Your layout saves in this browser automatically. The starting layout is an example arrangement; Reset layout brings it back.</p>`;
    return;
  }
  const ft = v => Math.floor(Math.round(v * 12) / 12), inch = v => Math.round(v * 12) % 12;
  el.innerHTML = `
    <div class="group"><h2>Selected piece</h2>
      <div class="field"><label for="i-name">Label</label><input class="inp" id="i-name" type="text" maxlength="40" value="${esc(it.name)}"></div>
    </div>
    <div class="group">
      <span class="lbl">Width (side to side)</span>
      <div class="pair">
        <div class="unit"><input class="inp num" id="i-wf" type="number" min="0" max="40" value="${ft(it.w)}" aria-label="Width feet"><span>ft</span></div>
        <div class="unit"><input class="inp num" id="i-wi" type="number" min="0" max="11" value="${inch(it.w)}" aria-label="Width inches"><span>in</span></div>
      </div>
      <span class="lbl">Depth (back to front)</span>
      <div class="pair">
        <div class="unit"><input class="inp num" id="i-df" type="number" min="0" max="40" value="${ft(it.d)}" aria-label="Depth feet"><span>ft</span></div>
        <div class="unit"><input class="inp num" id="i-di" type="number" min="0" max="11" value="${inch(it.d)}" aria-label="Depth inches"><span>in</span></div>
      </div>
      <span class="lbl">Rotation</span>
      <div class="pair">
        <div class="unit"><input class="inp num" id="i-rot" type="number" step="1" value="${Math.round(it.rot)}" aria-label="Rotation degrees"><span>°</span></div>
        <div class="pair" style="gap:4px"><button class="btn" id="i-rl" title="Rotate 90° left" style="justify-content:center">↺ 90</button><button class="btn" id="i-rr" title="Rotate 90° right" style="justify-content:center">↻ 90</button></div>
      </div>
    </div>
    <div class="group"><span class="lbl">Color</span>
      <div class="swatches">${COLORS.map(c => `<button class="sw" data-color="${c}" aria-label="${c}" aria-pressed="${it.color === c}" style="--f:var(--${c}-f);--s:var(--${c}-s)"></button>`).join('')}</div>
    </div>
    <div class="group"><span class="lbl">Position from NW exterior corner</span>
      <div style="font-family:var(--font-mono);font-size:12px">${fmt(it.x)} east · ${fmt(it.y)} south</div>
    </div>
    <div class="actions">
      <button class="btn" id="i-dup" style="justify-content:center">Duplicate</button>
      <button class="btn danger" id="i-del" style="justify-content:center">Delete</button>
      <button class="btn" id="i-front" style="justify-content:center">Bring to front</button>
      <button class="btn" id="i-back" style="justify-content:center">Send to back</button>
    </div>
    <button class="btn" id="i-done" style="justify-content:center">Done</button>`;
}
$('insp').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const it = sel();
  if (t.dataset.pick) { select(t.dataset.pick); focusOn(sel()); return; }
  if (!it) return;
  if (t.dataset.color) { checkpoint(); it.color = t.dataset.color; changed(); return; }
  switch (t.id) {
    case 'i-rl': checkpoint(); it.rot = norm(Math.round(it.rot - 90)); changed(); break;
    case 'i-rr': checkpoint(); it.rot = norm(Math.round(it.rot + 90)); changed(); break;
    case 'i-dup': duplicate(); break;
    case 'i-del': remove(); break;
    case 'i-front': checkpoint(); items = items.filter(i => i !== it).concat(it); changed(); break;
    case 'i-back': checkpoint(); items = [it].concat(items.filter(i => i !== it)); changed(); break;
    case 'i-done': select(null); break;
  }
});
$('insp').addEventListener('change', e => {
  const it = sel(); if (!it) return;
  const v = id => parseFloat($(id).value) || 0;
  checkpoint();
  if (e.target.id === 'i-name') it.name = e.target.value.trim() || 'Item';
  if (['i-wf', 'i-wi'].includes(e.target.id)) it.w = clamp(v('i-wf') + v('i-wi') / 12, .25, 40);
  if (['i-df', 'i-di'].includes(e.target.id)) it.d = clamp(v('i-df') + v('i-di') / 12, .25, 40);
  if (e.target.id === 'i-rot') it.rot = norm(v('i-rot'));
  changed();
});

// ---- Commands ----
function select(id) { selId = id; render(); renderInspector(); }
function viewCenterFt() {
  const r = svg.getBoundingClientRect();
  return { x: ((r.width / 2 - view.tx) / view.s - O.x) / PT, y: ((r.height / 2 - view.ty) / view.s - O.y) / PT };
}
function add(shape, name, wIn, dIn) {
  checkpoint();
  const c = viewCenterFt();
  const it = mk(shape, name, snapFt(c.x, IN), snapFt(c.y, IN), wIn / 12, dIn / 12, 0);
  items.push(it); selId = it.id; changed();
}
function duplicate() {
  const it = sel(); if (!it) return;
  checkpoint();
  const c = { ...it, id: 'f' + (uid++), x: it.x + 1, y: it.y + 1 };
  items.push(c); selId = c.id; changed();
}
function remove() {
  const it = sel(); if (!it) return;
  checkpoint(); items = items.filter(i => i !== it); selId = null; changed();
}
function focusOn(it) {
  if (!it) return;
  const r = svg.getBoundingClientRect();
  if (view.s < 3) view.s = 3;
  view.tx = r.width / 2 - wx(it.x) * view.s; view.ty = r.height / 2 - wy(it.y) * view.s; setView();
}

// ---- Catalog ----
$('catalog').innerHTML = CATALOG.map(([g, list]) => `<div class="group"><h2>${g}</h2><div class="cat-list">${list.map(([shape, name, w, d], i) =>
  `<button class="cat-btn" data-add="${shape}|${esc(name)}|${w}|${d}"><span><span class="plus">+</span> ${esc(name)}</span><span class="dim">${shape === 'round' || shape === 'plant' ? fmtIn(w) + ' ⌀' : fmtIn(w) + ' × ' + fmtIn(d)}</span></button>`).join('')}</div></div>`).join('');
$('catalog').addEventListener('click', e => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  const [shape, name, w, d] = b.dataset.add.split('|');
  add(shape, name.replace(/&amp;/g, '&'), +w, +d);
});
$('custom-form').addEventListener('submit', e => {
  e.preventDefault();
  const w = clamp(parseFloat($('c-w').value) || 36, 3, 480), d = clamp(parseFloat($('c-d').value) || 18, 3, 480);
  add('box', $('c-name').value.trim() || 'Custom piece', w, d);
  $('c-name').value = '';
});

// ---- Pointer interaction ----
const pointers = new Map();
let act = null;   // { kind: 'move'|'resize'|'rotate'|'pan'|'pinch', ... }
function toWorld(cx, cy) { const r = svg.getBoundingClientRect(); return { x: (cx - r.left - view.tx) / view.s, y: (cy - r.top - view.ty) / view.s }; }

svg.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    act = { kind: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), s0: view.s, mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, tx0: view.tx, ty0: view.ty };
    return;
  }
  const p = toWorld(e.clientX, e.clientY);
  const handle = e.target.closest('[data-handle]');
  const itemEl = e.target.closest('.item');
  const it = sel();
  if (handle && it) {
    const h = handle.dataset.handle;
    if (h === 'rot') act = { kind: 'rotate', it, dirty: false };
    else { const [sx, sy] = h.split(',').map(Number); act = { kind: 'resize', it, sx, sy, o: { ...it }, dirty: false }; }
  } else if (itemEl) {
    const id = itemEl.dataset.id;
    if (id !== selId) select(id);
    const t = sel();
    act = { kind: 'move', it: t, p0: p, o: { x: t.x, y: t.y }, dirty: false };
  } else {
    act = { kind: 'pan', c0: { x: e.clientX, y: e.clientY }, tx0: view.tx, ty0: view.ty, moved: false };
  }
});
svg.addEventListener('pointermove', e => {
  const p = toWorld(e.clientX, e.clientY);
  $('readout').textContent = `${fmt(Math.max(0, (p.x - O.x) / PT))} E · ${fmt(Math.max(0, (p.y - O.y) / PT))} S`;
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!act) return;
  const free = e.altKey || !prefs.snap;
  if (act.kind === 'pinch') {
    const [a, b] = [...pointers.values()]; if (!b) return;
    const d = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const r = svg.getBoundingClientRect();
    const s = clamp(act.s0 * d / act.d0, .3, 30);
    const wxp = (act.mid.x - r.left - act.tx0) / act.s0, wyp = (act.mid.y - r.top - act.ty0) / act.s0;
    view.s = s; view.tx = mid.x - r.left - wxp * s; view.ty = mid.y - r.top - wyp * s; setView(); return;
  }
  if (act.kind === 'pan') {
    const dx = e.clientX - act.c0.x, dy = e.clientY - act.c0.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { act.moved = true; svg.classList.add('panning'); }
    view.tx = act.tx0 + dx; view.ty = act.ty0 + dy; setView(); return;
  }
  const it = act.it;
  if (!act.dirty) { checkpoint(); act.dirty = true; }
  if (act.kind === 'move') {
    const nx = act.o.x + (p.x - act.p0.x) / PT, ny = act.o.y + (p.y - act.p0.y) / PT;
    it.x = free ? nx : snapFt(nx, IN); it.y = free ? ny : snapFt(ny, IN);
  } else if (act.kind === 'rotate') {
    let a = Math.atan2(p.y - wy(it.y), p.x - wx(it.x)) * 180 / Math.PI + 90;
    it.rot = norm(free ? Math.round(a) : Math.round(a / 15) * 15);
  } else if (act.kind === 'resize') {
    const o = act.o, a = o.rot * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
    const dxw = (p.x - wx(o.x)) / PT, dyw = (p.y - wy(o.y)) / PT;
    const lx = dxw * cos + dyw * sin, ly = -dxw * sin + dyw * cos;   // pointer in item's local feet
    let w = o.w, d = o.d;
    if (act.sx) w = clamp(act.sx * lx + o.w / 2, .25, 40);
    if (act.sy) d = clamp(act.sy * ly + o.d / 2, .25, 40);
    const round = o.shape === 'round' || o.shape === 'plant';
    if ((round || e.shiftKey) && act.sx && act.sy) { const k = Math.max(w / o.w, d / o.d); w = o.w * k; d = o.d * k; }
    if (!free) { w = Math.max(IN, snapFt(w, IN)); d = Math.max(IN, snapFt(d, IN)); }
    const ox = act.sx * (w - o.w) / 2, oy = act.sy * (d - o.d) / 2;
    it.w = w; it.d = d; it.x = o.x + ox * cos - oy * sin; it.y = o.y + ox * sin + oy * cos;
  }
  render();
  liveInspector(it);
});
function liveInspector(it) {
  const set = (id, v) => { const el = $(id); if (el && document.activeElement !== el) el.value = v; };
  set('i-wf', Math.floor(Math.round(it.w * 12) / 12)); set('i-wi', Math.round(it.w * 12) % 12);
  set('i-df', Math.floor(Math.round(it.d * 12) / 12)); set('i-di', Math.round(it.d * 12) % 12);
  set('i-rot', Math.round(it.rot));
}
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (!act) return;
  if (act.kind === 'pan' && !act.moved && e.type === 'pointerup') select(null);
  if (act.dirty) { save(); renderInspector(); }
  svg.classList.remove('panning');
  if (!pointers.size || act.kind === 'pinch') act = null;
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', () => { $('readout').textContent = ''; });

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const k = Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018));
  zoomAt(e.clientX - r.left, e.clientY - r.top, k);
}, { passive: false });
function zoomAt(sx, sy, k) {
  const s = clamp(view.s * k, .3, 30);
  const wxp = (sx - view.tx) / view.s, wyp = (sy - view.ty) / view.s;
  view.s = s; view.tx = sx - wxp * s; view.ty = sy - wyp * s; setView();
}
function fit() {
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  const s = Math.min(r.width / PLAN_BOX.w, r.height / PLAN_BOX.h) * .98;
  view.s = s; view.tx = (r.width - PLAN_BOX.w * s) / 2 - PLAN_BOX.x * s; view.ty = (r.height - PLAN_BOX.h * s) / 2 - PLAN_BOX.y * s; setView(false); userView = false;
}
$('z-in').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.4); };
$('z-out').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.4); };
$('z-fit').onclick = fit;

// ---- Keyboard ----
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  const it = sel(); if (!it) return;
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicate(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); remove(); return; }
  if (e.key === 'Escape') { select(null); return; }
  if (e.key === 'r' || e.key === 'R') { checkpoint(); it.rot = norm(Math.round(it.rot + (e.shiftKey ? -90 : 90))); changed(); return; }
  const step = e.shiftKey ? 1 : IN;
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (mv) { e.preventDefault(); checkpoint(); it.x += mv[0]; it.y += mv[1]; changed(); }
});

// ---- Header controls ----
$('undo').onclick = undo; $('redo').onclick = redo;
const tg = (id, key, fn) => { const el = $(id); el.checked = prefs[key]; el.onchange = () => { prefs[key] = el.checked; save(); fn(); }; };
tg('tg-grid', 'grid', () => { $('grid').style.display = prefs.grid ? '' : 'none'; });
tg('tg-rooms', 'rooms', renderRooms);
tg('tg-labels', 'labels', render);
tg('tg-snap', 'snap', () => {});
const pop = $('reset-pop'), rb = $('reset-btn');
const closePop = () => { pop.hidden = true; rb.setAttribute('aria-expanded', 'false'); };
rb.onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; rb.setAttribute('aria-expanded', String(!pop.hidden)); };
document.addEventListener('click', e => { if (!pop.hidden && !e.target.closest('.reset-wrap')) closePop(); });
$('reset-cancel').onclick = closePop;
$('reset-sample').onclick = () => { checkpoint(); items = sampleItems(); selId = null; closePop(); changed(); fit(); };
$('reset-clear').onclick = () => { checkpoint(); items = []; selId = null; closePop(); changed(); };

// ---- Boot ----
load();
$('grid').style.display = prefs.grid ? '' : 'none';
['tg-grid', 'tg-rooms', 'tg-labels', 'tg-snap'].forEach(id => { $(id).checked = prefs[{ 'tg-grid': 'grid', 'tg-rooms': 'rooms', 'tg-labels': 'labels', 'tg-snap': 'snap' }[id]]; });
renderRooms(); render(); renderInspector();
fit();
new ResizeObserver(() => { if (!act && !userView) fit(); }).observe($('stage-wrap'));
})();
</script>

</body>
</html>
